name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1
      - name: Use latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      # No NPM_TOKEN needed: this package's npm Trusted Publisher config
      # (npmjs.com > package > Settings > Trusted Publisher) trusts this
      # exact repo + workflow filename via GitHub's OIDC token. Provenance
      # is attached automatically.
      - name: Publish to npm
        run: npm publish --access public
